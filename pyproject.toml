[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safety-boundary-sentinel"
version = "0.1.0"
description = "Semantic intent classifier and harm-mitigation guardrail preventing dangerous agent operations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-safety-boundary-sentinel = "agent_safety_boundary_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_safety_boundary_sentinel*"]
